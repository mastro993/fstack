<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brewcard pricing</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Pricing</h1>
    <p>Stamp cards your regulars actually keep.</p>
  </header>
  <main class="plans">
    <section class="plan">
      <h2>Solo</h2>
      <p class="price">€0 <small>/ month</small></p>
      <ul><li>1 shop</li><li>Digital stamp card</li><li>Basic stats</li></ul>
      <a class="cta" href="/signup?plan=solo">Buy</a>
    </section>
    <section class="plan">
      <h2>Team</h2>
      <p class="price">€12 <small>/ month</small></p>
      <ul><li>Up to 3 shops</li><li>Custom rewards</li><li>Staff accounts</li></ul>
      <a class="cta" href="/signup?plan=team">Buy</a>
    </section>
    <section class="plan">
      <h2>Studio</h2>
      <p class="price">€29 <small>/ month</small></p>
      <ul><li>Unlimited shops</li><li>API access</li><li>Priority support</li></ul>
      <a class="cta" href="/signup?plan=studio">Buy</a>
    </section>
  </main>
</body>
</html>
