[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wxdata"
version = "0.4.0"
description = "Ingests, cleans, and aggregates weather station readings from SkyFeed."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "click>=8.1",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pandas>=2.2",
    "protobuf>=4.25",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.4",
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.5",
]

[project.scripts]
wx = "wxdata.cli:main"

[tool.setuptools.packages.find]
include = ["wxdata*"]

[tool.setuptools.package-data]
wxdata = ["templates/*.j2", "py.typed", "*.pyi"]

# Added black config
[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "(vendor|migrations|_pb2\\.py)"

[tool.ruff]
line-length = 100
extend-exclude = ["vendor", "migrations", "*_pb2.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["vendor/", "migrations/"]

[[tool.mypy.overrides]]
module = ["wxdata.proto.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
