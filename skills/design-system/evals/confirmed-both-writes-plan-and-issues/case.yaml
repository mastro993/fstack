schema_version: "1.1"
name: confirmed-both-writes-plan-and-issues
expected_outcome: |
  The user confirmed the proposal, approved one spec change and declined the other, and chose both
  deliveries. The run adds primary-dark, surface-dark, on-surface-dark and border-dark to DESIGN.md
  and leaves theme.css unchanged. It writes acme-dash/docs/design-system/plan.md with the catalog
  (every component with its tier), the opportunities with their call sites, the README outline, the
  declined rename recorded as declined, and the five slices in order with acceptance checks and
  dependencies, and commits it with DESIGN.md on a branch. Then it hands the plan to the create-issues
  skill, which shows an issue plan in build order (module and tokens first, Button before
  ConfirmDialog), each issue with its blockers and split trigger, files nothing yet, and asks whether
  to file it. Nothing under acme-dash/src changes.
context:
  scaffold_script: place-files.sh
